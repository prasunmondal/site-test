<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
          font-family: "Poppins", sans-serif;
          background: #e0e5ec;
          padding: 20px;
        }

        .card {
          width: 90%;
          margin: auto;
          padding: 24px;
          border-radius: 22px;
          background: #e0e5ec;
          box-shadow: 9px 9px 16px #a3b1c6,
                      -9px -9px 16px #ffffff;
        }

        .title {
          font-size: 20px;
          font-weight: 700;
          margin-bottom: 14px;
        }

        .inset-box {
          margin-top: 12px;
          padding: 14px;
          border-radius: 14px;
          background: #e0e5ec;
          box-shadow: inset 6px 6px 10px #a3b1c6,
                      inset -6px -6px 10px #ffffff;
        }

        .button {
          margin-top: 18px;
          padding: 16px;
          border-radius: 16px;
          text-align: center;
          font-weight: 600;
          background: #e0e5ec;
          cursor: pointer;
          box-shadow: 6px 6px 12px #a3b1c6,
                      -6px -6px 12px #ffffff;
          transition: 0.2s ease;
        }

        .button:active {
          box-shadow: inset 6px 6px 12px #a3b1c6,
                      inset -6px -6px 12px #ffffff;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="title">💸 Payment Options</div>

    <div class="inset-box">UPI ID: mbros@upi</div>
    <div class="inset-box">Bank: Canara Bank</div>

    <div class="button">Become a Partner</div>
</div>

</body>
</html>
