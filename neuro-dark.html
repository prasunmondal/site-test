<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
          font-family: "Poppins", sans-serif;
          background: #1f1f1f;
          padding: 20px;
        }

        .card {
          width: 90%;
          margin: auto;
          padding: 24px;
          border-radius: 22px;
          background: #1f1f1f;
          box-shadow: 9px 9px 16px #0d0d0d,
                      -9px -9px 16px #333333;
          color: #eaeaea;
        }

        .inset-box {
          margin-top: 12px;
          padding: 14px;
          border-radius: 14px;
          background: #1f1f1f;
          box-shadow: inset 6px 6px 10px #0d0d0d,
                      inset -6px -6px 10px #333333;
        }

        .button {
          margin-top: 18px;
          padding: 16px;
          border-radius: 16px;
          text-align: center;
          font-weight: 600;
          background: #1f1f1f;
          cursor: pointer;
          box-shadow: 6px 6px 12px #0d0d0d,
                      -6px -6px 12px #333333;
          transition: 0.2s ease;
        }

        .button:active {
          box-shadow: inset 6px 6px 12px #0d0d0d,
                      inset -6px -6px 12px #333333;
        }
    </style>
</head>

<body>

<div class="card">
    <h3>💸 Payment Options</h3>

    <div class="inset-box">UPI ID: mbros@upi</div>
    <div class="inset-box">Account No: 123456789</div>

    <div class="button">Join as Customer</div>
</div>

</body>
</html>
