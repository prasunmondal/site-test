<!DOCTYPE html>
<html>
<head>
    <title>Customer Locations - 5km Radius</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map { height: 100vh; width: 100%; }
        .label-text {
          font-size: 14px;
          font-weight: bold;
          color: darkblue;
        }
    </style>
</head>
<body>
<div id="map"></div>

<script>
    // Create map centered around the general customer cluster
    var map = L.map('map').setView([22.85, 87.78], 10);

    // Add OpenStreetMap tiles
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18
    }).addTo(map);

    // Customer coordinates with placeholder names
    var customers = [
      [22.8998540, 87.7561480, "Customer A"],
      [22.890813, 87.779177, "Customer B"],
      [22.865834, 87.794584, "Customer C"],
      [22.8257582, 87.7930826, "Customer D"],
      [22.8201897, 87.7789979, "Customer E"],
      [22.8134624, 87.7743787, "Customer F"]
    ];

    // Add markers & 5km radius shading for each
    customers.forEach(function(cust) {
      // marker
      L.marker([cust[0], cust[1]])
        .addTo(map)
        .bindPopup(cust[2]);

      // circle radius
      L.circle([cust[0], cust[1]], {
        radius: 5000,
        color: "blue",
        fillColor: "blue",
        fillOpacity: 0.15
      }).addTo(map);
    });

</script>
</body>
</html>
