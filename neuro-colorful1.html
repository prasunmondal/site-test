<!DOCTYPE html>
<html>
<head>
    <style>
        body {
          font-family: "Poppins", sans-serif;
          background: linear-gradient(135deg, #fff1d0, #ffd7d7);
          padding: 24px;
        }

        .card {
          background: white;
          padding: 22px;
          border-radius: 18px;
          box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .title {
          font-size: 22px;
          font-weight: 700;
          color: #ff3b3b;
          margin-bottom: 12px;
        }

        .row {
          background: #fff5c0;
          padding: 14px;
          border-radius: 14px;
          margin: 8px 0;
          font-weight: 600;
        }

        .button {
          background: linear-gradient(135deg, #ff3b3b, #ffa600);
          color: white;
          padding: 16px;
          text-align: center;
          border-radius: 18px;
          font-weight: 700;
          font-size: 18px;
          margin-top: 18px;
          cursor: pointer;
          border: none;
          box-shadow: 0 6px 14px rgba(255, 59, 59, .4);
        }
        .button:active {
          transform: scale(.97);
        }
    </style>
</head>

<body>
<div class="card">
    <div class="title">💸 Payment Options</div>

    <div class="row">UPI ID: mbros@upi</div>
    <div class="row">Bank: Canara Bank</div>

    <button class="button">Become a Partner</button>
</div>
</body>
</html>
